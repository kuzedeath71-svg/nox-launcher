
name: Build NoxLauncher APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'NoxLauncher-full-project.zip'
      - '.github/workflows/android.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Extract project ZIP
        run: |
          unzip -oq NoxLauncher-full-project.zip -d unpacked

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        working-directory: unpacked/NoxLauncher
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NoxLauncher-APK
          path: unpacked/NoxLauncher/app/build/outputs/apk/debug/*.apk
          
